# 合并到代理 Sub2API 的 Nginx server 块中。
# sidecar 只绑定在宿主机 127.0.0.1:8091，不应直接暴露到公网。

location /quota-sync/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_buffering off;
}

# 在原有代理 Sub2API 前端的 location / 中加入以下三行。
# 如果启用了 gzip，上游压缩响应无法执行 sub_filter，因此清空 Accept-Encoding。
proxy_set_header Accept-Encoding "";
sub_filter_once on;
sub_filter '</head>' '<script defer src="/quota-sync/menu.js"></script></head>';
